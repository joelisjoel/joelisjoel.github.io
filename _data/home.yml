# Everything on the homepage and the section pages comes from this file.
# Source of truth for the copy: the "Joel Is Joel Visual Resume" deck in
# Google Slides (sections and items in the deck's order).
#
# To add something: copy an item, paste it where you want it in the list,
# and change the fields. The homepage shows the first 3 items of each section
# and folds the rest under "Show N more". Section pages show everything.
#
# Item fields
#   id       short unique name, used for links like /projects/#skywyrm
#   title    required
#   meta     small line above the title (dates, type)
#   blurb    the tagline on the homepage card (one or two sentences)
#   more     optional article (Markdown, ~200 words) shown on the section
#            page. When an item has one, its homepage card opens the article.
#   image    /images/home/<name>.jpg: 640x360 (16:9), or 400x400 for About
#   icon     instead of an image: x, linkedin, youtube, substack, github, instagram, tiktok
#   image_hint  what picture is still needed (shown when there is no image)
#   url      where the item lives (video, game, page)
#   youtube  a YouTube video id: the section page shows the player itself
#            (privacy-enhanced youtube-nocookie.com) instead of the thumbnail
#   cta      label for the url's button on the section page (default "Open")
#   soon     true = adds a "Coming soon" badge
#   todo     true = placeholder you still need to fill in (dashed outline;
#            left out of llms.txt). Search this file for "todo: true".

