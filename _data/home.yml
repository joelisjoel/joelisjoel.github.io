    items:
      - id: world-pulse
        title: World Pulse
        meta: 3D globe · 2025
        blurb: Vibe coded visualization of top world events.
        image: /images/home/world-pulse.jpg
        url: /worldview/
        cta: Spin the globe
        more: |
          World Pulse is a spinning Earth with a handful of news events pinned
          where they happened, each glowing by category and intensity. It was
          vibe coded in 2025 from a description, and it shows both sides of
          that: a convincing 3D globe in an afternoon, and events typed in by
          hand. For a while the live globe showed no events at all, because
          it was still loading them from the builder's own laptop.

          The better versions of this idea today don't stop at the picture.
          They pull from live news and event feeds, cluster related stories,
          update on their own and say where each claim came from. The globe
          is the easy part; trustworthy, current data and the judgment about
          what matters are the hard parts.

          That's the real lesson of being able to assemble a vision quickly.
          When a working prototype costs an afternoon, code stops being the
          scarce thing. What's scarce is the data pipeline behind the
          picture, the taste to know which picture is worth making, and the
          discipline to keep it true after the demo.

      - id: metacube
        title: Metacube
        meta: 3D · three.js
        blurb: Exploration of vibe coding visualizations with chat and no-look coding.
        image: /images/home/metacube.jpg
        url: /metacube/
        cta: Spin the cube
        more: |
          Metacube began as a single rotating emerald cube and grew, one chat
          at a time, into six tiny worlds: a chessboard, a breathing Mandelbrot
          landscape, a mechanical clock with a real going train, a robot
          workshop with a volumetric hologram, Escher's *Relativity* with
          figures walking its stairs, and a strange-loop knot. It was built by
          describing scenes and judging screenshots, without reading the code.

          The strength of that approach is range. Words alone produced real
          gear ratios, momentum-based rotation and shadows that most people
          couldn't hand-code in a weekend. The weaknesses show in its own
          design notes: every face animates at full detail all the time,
          helper code is copy-pasted between faces, there are no tests, and
          the touch-drag direction was "fixed" twice, in opposite directions,
          because nobody was reading what changed.

          Done again today, the same vision would come with the engineering
          built in: agents that render each face and compare screenshots,
          write tests, pull shared code into a library and hold a performance
          budget for phones. The human job moves from typing prompts to
          setting constraints and reviewing results.

