    items:
      - id: decision-engineering
        title: Decision Engineering
        meta: Video · 3 min
        blurb: The evolution from data engineering to decision engineering.
        image: /images/home/video-decision-engineering.jpg
        url: https://www.youtube.com/watch?v=q2ZdZNjGvws
        youtube: q2ZdZNjGvws
        # Summary drawn from the video's description; replace with a
        # summary of the script when it's at hand.
        more: |
          A three-minute look at what still counts as a moat once AI can do
          the work. The argument moves from customer service, through data
          gravity, to the system of record: the place where a business writes
          down what is true.

          The claim is that owning that record is the durable advantage, and
          that the people who build on it are changing jobs. Data engineering
          was about moving and shaping data so that people could decide. As AI
          starts to make and carry out decisions, the work becomes decision
          engineering: choosing which decisions to automate, on what evidence,
          and how their outcomes flow back into the record.

      - id: pascals-bunker
        title: Pascal's Bunker
        meta: Video · 3 min
        soon: true
        blurb: >-
          If AI ends the world, will building a bunker help? The parallel
          between the possibility of a digital god and Pascal's wager.
        image: /images/home/video-pascals-bunker.jpg
        more: |
          In 1642 a nineteen-year-old built a machine that did arithmetic.
          Blaise Pascal later made history's most famous bet on something
          smarter than himself.

          Now we are building something smarter than ourselves, and some of
          its makers talk about bunkers. Pascal's Bunker is the modern wager:
          assume the worst about AI and make one move you can't undo.

          So when is the bunker the right call? Will AI become a kind of
          digital god, and if it does, can anything you do now hedge against
          it? If it never arrives, what did the bunker cost you? And if the
          truth lands in the middle, where AI takes jobs and the world goes
          on, which bets pay off in every future?

          Three minutes, one ladder, and the question Pascal would ask first:
          how much does your choice actually change the outcome?

  - id: projects
    title: Projects
    blurb: Things I'm working on recently.
    page: /projects/
    see_all: All projects
    items:
      - id: pequalsnp
        title: PequalsNP Lemma Visualizer
        meta: Visualization · 2026
        # The deck's tagline here repeats Skywyrm's; this one is a draft
        blurb: >-
          Mapping an AI agent fleet's public attack on P vs NP, one lemma at a
          time.
        image: /images/home/pequalsnp-visualizer.jpg
        # Square clip, 49 s, with voiceover; the first frame (and the image above) is the laser peak at hour 72
        video: /videos/pnp-tug-of-war-nov26.mp4
        video_square: true
        poster: /images/home/pequalsnp-clip-poster.jpg
        more: |
          P vs NP asks whether every problem whose answer is easy to check is
          also easy to solve. [pequalnp.com](https://pequalnp.com/), a project
          by Amichai and Lior built in Brilliant, is attacking it in public
          with a fleet of AI agents, and the Lean proof checker is the only
          judge of what counts.

          The visualizer draws that record as a tug of war. Lemmas line up on
          the side of the answer they support, one rope per theme. Open claims
          stand at the front and checked ones farther back, and every lemma
          stands in front of whatever it rests on, so each chain reads as a
          stack. Gold marks recent activity. Kills are lasers: the project
          refutes a lemma by proving its exact opposite. The claim itself is
          the knot at midfield that every rope ties into.

          As of November 26, 11,176 lemmas were checked. None pulls toward
          P = NP, and no lemma even states P ≠ NP. Each program's target is a
          stepping stone rather than the claim, so the knot hasn't moved, and
          the picture shows effort and shape, not distance. The project calls
          its own tally "a count, not a probability."

          The clip above is a daily update with voiceover: what changed since
          the last snapshot.

      - id: dendros
        title: Dendros
        meta: Data visualization
        blurb: >-
          Exploring how tree based visualizations can make data science like a
          “walk in the park”.
        image: /images/home/dendros.jpg
        url: https://dendroslabs.com/

      - id: skywyrm
        title: Skywyrm
        meta: Game · PC & phone
        blurb: Exploring the limits of vibe coded games and autonomous growth loops.
        image: /images/home/skywyrm.jpg
        url: https://skywyrm.io/
        cta: Play at skywyrm.io
        more: |
          Skywyrm started as snake. In 2025 the snake games were built by
          writing a careful spec and handing it to a chat model: a Tron-style
          board, a snake's-eye camera, a soundtrack, all in one HTML file.
          [Snake 2.5D](/snake/) stacked a top view over a first-person view;
          [Snake 3D](/snake3/) split the arena into four viewports. The code
          still carries the model's confusion about the spec in its comments,
          and the specs carry a firm note: human-authored, AI makes no edits.

          ![Snake 3D, 2025: one arena seen four ways](/images/home/snake3.jpg)

          The Snake 3D roadmap listed five ideas: 3D movement, a spherical
          arena, visual effects, an AI player and multiplayer. Skywyrm has all
          five. Dragons fly freely, "The Orb" is a zero-G sphere with no up or
          down, bots fill the sky, and anyone can open a server and invite a
          friend. It runs free in the browser with no sign-up, no ads and no
          tracking. The difference is the method: agents that plan, build,
          test and ship across many sessions, rather than one prompt at a time.

          Can a game like this run its own AI-driven growth loop yet? Building
          is now cheap, but the loop still breaks in two places. Agents can't
          yet feel what's fun, so taste comes from people playing. And growth
          needs measurement, which pulls against a game that deliberately
          tracks no one. Can games built this way add value? Small, free,
          ad-free games are gifts, and they show anyone with an idea how far a
          spec can now go.

