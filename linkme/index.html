  <style>

    :root {

      --base: #3FA9AE;

      --blob-2: #2B98AE;

      --accent: #FFFFFF;
      --line: rgba(255, 255, 255, 0.92);
      --btn-bg: rgba(0, 60, 66, 0.06);
      --btn-hover: rgba(255, 255, 255, 0.16);
      --avatar-bg: rgba(0, 60, 66, 0.35);
      --ring: rgba(255, 255, 255, 0.85);
      --shadow: rgba(0, 50, 55, 0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --base: #0A2629;
        --blob-1: #134540;
        --blob-2: #0C3B4A;

        --text: #E6F6F5;
        --accent: #5FD3D6;
        --line: rgba(95, 211, 214, 0.55);
        --btn-bg: rgba(41, 194, 199, 0.07);

        --avatar-bg: #0F4448;
        --ring: #29C2C7;
        --shadow: rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }

    html { background: var(--base); }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        var(--grain),
        radial-gradient(70% 45% at 8% 4%, var(--blob-1) 0%, transparent 70%),
        radial-gradient(60% 50% at 100% 22%, var(--blob-2) 0%, transparent 70%),
        radial-gradient(70% 45% at 0% 70%, var(--blob-3) 0%, transparent 70%),
        radial-gradient(80% 50% at 100% 100%, var(--blob-4) 0%, transparent 70%),
        var(--base);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.35;
      text-shadow: 0 1px 2px var(--shadow);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      max-width: 580px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      text-align: center;
    }

    .avatar {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--avatar-bg);
      box-shadow: 0 0 0 3px var(--ring);
      color: var(--accent);
    }

    .avatar span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .bio {
      margin: 6px 0 0;
      font-size: 1.05rem;
      font-weight: 500;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin: 14px 0 28px;
    }

    .social a {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: var(--accent);
      transition: background-color 0.15s;
    }

    .social a:hover { background: var(--btn-hover); }

    .social svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
      filter: drop-shadow(0 1px 1px var(--shadow));
    }

    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    /* Icon in a fixed left slot, title centered */
    .btn {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 10px;
      min-height: 64px;
      padding: 7px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: var(--btn-bg);
      font-size: 1.05rem;
      font-weight: 500;
      transition: background-color 0.15s, transform 0.15s;
    }

    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    .label { overflow-wrap: anywhere; }

    .ico {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      color: var(--accent);
    }

    .ico svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
      filter: drop-shadow(0 1px 1px var(--shadow));
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      margin-top: 44px;
      font-size: 0.9rem;
    }

    footer a { border-bottom: 1px solid currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .btn, .social a { transition: none; }
      .btn:hover { transform: none; }
    }
