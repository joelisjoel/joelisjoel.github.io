# Everything on the homepage and the section pages comes from this file.
#
# To add something: copy an item, paste it where you want it in the list,
# and change the fields. The homepage shows the first 3 items of each section
# and folds the rest under "Show N more". Section pages show everything.
#
# Item fields
#   id       short unique name, used for links like /projects/#fire
#   title    required
#   meta     small line above the title (type · date)
#   blurb    one or two sentences
#   more     optional longer text, shown on the section page only
#   image    /images/home/<name>.jpg, 640x360 (16:9); square-ish for About
#   icon     instead of an image: x, linkedin, youtube, substack, github, instagram, tiktok
#   image_hint  what picture is still needed (shown when there is no image)
#   url      where the card goes; leave out to link to the section page
#   soon     true = adds a "Coming soon" badge
#   todo     true = placeholder you still need to fill in (dashed outline;
#            left out of llms.txt). Search this file for "todo: true".

hero:
  status: "Now building Skywyrm, a 3D dragon game"
  status_url: https://skywyrm.io/
  photo: /images/joel.jpg
  greeting: "Hi, I'm Joel."
  headline_start: "Learning to surf the wave of"
  headline_em: "superintelligence."
  # Draft written from your X bio, YouTube and projects. Edit freely.
  intro: >-
    I build at the edges of data, AI and play: from a Facebook app that
    passed a million installs in 2007, to living data trees, a 3D dragon game
    and a robotics club in Fremont. This is where I keep what I'm thinking
    about, what I'm making, and what I've made.

sections:
  - id: about
    title: About
    blurb: "[Placeholder: two or three sentences paraphrasing your LinkedIn headline and About.]"
    page: /about/
    see_all: More about me
    style: list
    # Longer bio for /about/. Placeholder until you send LinkedIn text.
    long: >-
      [Placeholder: a longer bio, three or four short paragraphs. Paste your
      LinkedIn About and Experience (or a resume) and I'll paraphrase it here.]
    items:
      - id: now
        title: "[Current role]"
        meta: "[Company] · [Years]"
        blurb: "[One line on what you do there.]"
        image_hint: Logo
        todo: true
      - id: before
        title: "[Previous role]"
        meta: "[Company] · [Years]"
        blurb: "[One line on what you did there.]"
        image_hint: Logo
        todo: true
      - id: kissme
        title: Co-creator, KissMe on Facebook
        meta: Stanford · 2007–2009
        blurb: >-
          The first app from Stanford's Facebook class to pass a million
          installs, spread by simple direct messages.
        more: >-
          Planned as a meetup planner for Full Moon on the Quad, KissMe became
          a simple way to show affection on Facebook. The video maps its viral
          growth from October 2007 to October 2009.
        image: /images/home/video-kissme.jpg
        url: https://www.youtube.com/watch?v=1nREHPymu_0
      - id: school
        title: "[Education]"
        meta: "[School] · [Degree] · [Years]"
        blurb: "[Optional one line.]"
        image_hint: Logo
        todo: true

  - id: thoughts
    title: Thoughts
    blurb: Videos and writing on AI, data, and whatever I'm exploring.
    page: /thoughts/
    see_all: All thoughts
    items:
      - id: decision-engineering
        title: Toward decision engineering
        meta: Video · Sep 2026
        blurb: >-
          Moats in an AI-powered world, from customer service to data gravity
          to systems of record. We're moving from data engineering to decision
          engineering.
        image: /images/home/video-decision-engineering.jpg
        url: https://www.youtube.com/watch?v=q2ZdZNjGvws
      - id: substack
        title: "[First Substack post title]"
        meta: Writing · Substack
        blurb: "[Placeholder: one-line summary. Only a test post is on Substack so far.]"
        image_hint: Post image
        url: https://joelisjoel.substack.com/
        todo: true
      - id: x
